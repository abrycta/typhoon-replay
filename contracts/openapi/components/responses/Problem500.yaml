description: 'Unexpected failure (`internal`). Never contains stack traces or SQL.'
headers:
  X-Backend-Impl:
    $ref: ../headers/X-Backend-Impl.yaml
  X-Backend-Version:
    $ref: ../headers/X-Backend-Version.yaml
  X-Contract-Version:
    $ref: ../headers/X-Contract-Version.yaml
  X-Request-Id:
    $ref: ../headers/X-Request-Id.yaml
  Cache-Control:
    $ref: ../headers/Cache-Control.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yaml
    examples:
      internal:
        value:
          type: https://typhoon.krtmtthw.dev/problems/internal
          title: Internal server error
          status: 500
          detail: Example detail text; free-form.
          instance: '/v1/storms'
          code: internal
          requestId: 01JAXQ7Z9V8M3K2W4R6T5Y1N0P
          errors:
                - pointer: "#/query/limit"
                  detail: must be <= 100
