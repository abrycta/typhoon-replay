title: ProblemCode
description: |
  Stable machine-readable error code. `type` is `https://replay.krtmtthw.dev/problems/{code}` and `title` is fixed per code:
  validation "Request validation failed"; invalid-cursor "Invalid cursor"; not-found "Not found";
  method-not-allowed "Method not allowed"; not-acceptable "Not acceptable"; payload-too-large "Payload too large";
  unsupported-media-type "Unsupported media type"; rate-limited "Too many requests"; internal "Internal server error";
  not-ready "Service not ready"; stream-capacity "Too many live streams".
  Contract 2.0.0 removed the account codes `unauthenticated`, `forbidden`, `csrf`, `conflict`, `precondition-failed`
  and `unprocessable`.
type: string
enum:
  - validation
  - invalid-cursor
  - not-found
  - method-not-allowed
  - not-acceptable
  - payload-too-large
  - unsupported-media-type
  - rate-limited
  - internal
  - not-ready
  - stream-capacity
