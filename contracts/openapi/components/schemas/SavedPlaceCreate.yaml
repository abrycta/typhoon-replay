title: SavedPlaceCreate
description: |
  Exactly one of `placeId` (a catalogue place) or `position` (an arbitrary point) MUST be given; otherwise 422 `unprocessable`.
  `label` defaults to the place name, or to the coordinates for a point.
type: object
properties:
  placeId:
    type: string
    pattern: '^(PH-[0-9]{10}|JP-[0-9]{5})$'
  position:
    $ref: ./LonLat.yaml
  label:
    type: string
    minLength: 1
    maxLength: 80
