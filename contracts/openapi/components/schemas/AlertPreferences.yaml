title: AlertPreferences
description: Email alert settings. Matching and sending happen in the shared pipeline job, never in a backend.
type: object
required: [enabled, radiusKm, minWindKt, savedPlaceIds, language]
properties:
  enabled:
    type: boolean
  radiusKm:
    $ref: ./RadiusKm.yaml
  minWindKt:
    type: number
    minimum: 0
    maximum: 200
  savedPlaceIds:
    type: array
    description: Saved places to watch; empty means all of the user's saved places.
    maxItems: 20
    uniqueItems: true
    items:
      type: string
      format: uuid
  language:
    type: string
    enum: [en, ja]
  email:
    type: string
    format: email
    description: Delivery address (read-only; from the user's verified provider email).
  updatedAt:
    type: string
    format: date-time
