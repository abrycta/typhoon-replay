title: SavedPlace
type: object
required: [id, label, position, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
  label:
    type: string
    minLength: 1
    maxLength: 80
  placeId:
    type: string
    pattern: '^(PH-[0-9]{10}|JP-[0-9]{5})$'
  place:
    $ref: ./PlaceSummary.yaml
  position:
    $ref: ./LonLat.yaml
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
