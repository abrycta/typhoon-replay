title: TrackPointProperties
type: object
required: [at]
properties:
  at:
    type: string
    format: date-time
  windKt:
    type: number
    description: Sustained wind from `windAgency`.
  windAgency:
    $ref: ./Agency.yaml
  gustKt:
    type: number
  pressureHpa:
    type: number
  nature:
    type: string
    description: IBTrACS NATURE (DS, TS, ET, SS, NR, MX), spelled out.
    enum: [disturbance, tropical, extratropical, subtropical, not-reported, mixed]
  sshsCategory:
    type: integer
    description: Saffir–Simpson category from JTWC (-5..5; negative values are IBTrACS sub-storm classes).
    minimum: -5
    maximum: 5
  jmaGrade:
    type: integer
    minimum: 2
    maximum: 9
  distanceToLandKm:
    type: number
  speedKt:
    type: number
  directionDeg:
    type: number
    minimum: 0
    maximum: 360
