title: AlertPreferencesUpdate
description: Full replacement. An id in `savedPlaceIds` that is not one of the user's saved places returns 422 `unprocessable`.
type: object
required: [enabled, radiusKm, minWindKt, savedPlaceIds]
properties:
  enabled:
    type: boolean
  radiusKm:
    $ref: ./RadiusKm.yaml
  minWindKt:
    type: number
    minimum: 0
    maximum: 200
  savedPlaceIds:
    type: array
    maxItems: 20
    uniqueItems: true
    items:
      type: string
      format: uuid
  language:
    type: string
    enum: [en, ja]
