get:
  operationId: searchPlaces
  tags: [places]
  summary: Search PH cities/municipalities and JP municipalities
  description: |
    Case-insensitive match on Latin, Filipino and Japanese names and on region/province/prefecture names.
    Order: exact name match, then prefix, then substring; ties by population descending, then id. Not paginated.
  parameters:
    - name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: taclo
    - $ref: ../components/parameters/Country.yaml
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: Matching places.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PlaceSearchResults.yaml
          examples:
            tacloban:
              $ref: ../components/examples/PlaceSearchTacloban.yaml
            naha:
              $ref: ../components/examples/PlaceSearchNaha.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
