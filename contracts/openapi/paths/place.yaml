get:
  operationId: getPlace
  tags: [places]
  summary: Place detail with simplified boundary
  parameters:
    - $ref: ../components/parameters/PlaceId.yaml
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: The place.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PlaceDetail.yaml
          examples:
            tacloban:
              $ref: ../components/examples/PlaceDetailTacloban.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
