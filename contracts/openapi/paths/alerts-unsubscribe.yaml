get:
  operationId: unsubscribeAlerts
  tags: [alerts]
  summary: One-click unsubscribe from alert email
  description: Anonymous. Sets `enabled = false` for the subscription holding `token` and returns a small HTML page (the only non-JSON success response).
  parameters:
    - name: token
      in: query
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    '200':
      description: 'Unsubscribed. `Cache-Control: private, no-store`.'
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
      content:
        text/html:
          schema:
            type: string
          example: '<!doctype html><meta charset="utf-8"><title>Unsubscribed</title><p>You will no longer receive Typhoon Replay alerts.</p>'
    '400':
      $ref: ../components/responses/Problem400.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
