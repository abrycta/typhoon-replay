post:
  operationId: logout
  tags: [auth]
  summary: Sign out
  description: Sets `revoked_at` on the session (effective on every backend immediately) and clears the cookie. Idempotent; 204 even without a session.
  security:
    - sessionCookie: []
      csrfHeader: []
    - csrfHeader: []
  responses:
    '204':
      description: Signed out.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        Set-Cookie:
          $ref: ../components/headers/Set-Cookie-Session.yaml
    '403':
      $ref: ../components/responses/Problem403.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
