get:
  operationId: getHealth
  tags: [meta]
  summary: Liveness probe
  description: Process is up. No database access. Served at the backend root, outside `/v1`. Answers within 1 s of the port opening.
  responses:
    '200':
      description: Alive.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Health.yaml
          example:
            status: ok
            impl: java
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
