post:
  operationId: createTestLiveEvent
  tags: [test-hooks]
  x-internal: true
  summary: 'Test hook: apply a live event'
  description: Only when `TR_TEST_HOOKS=1`; otherwise 404 `not-found`. Runs `SELECT live.apply_event(type, payload)`. Not CSRF-checked.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TestLiveEventCreate.yaml
        example:
          type: storm-removed
          payload:
            liveId: jma-2622
            reason: dissipated
  responses:
    '201':
      description: Applied.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TestLiveEventCreated.yaml
          example:
            seq: 2
    '400':
      $ref: ../components/responses/Problem400.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
