get:
  operationId: getStormTrack
  tags: [storms]
  summary: Observed track at best-track resolution
  description: |
    GeoJSON FeatureCollection of best-track fixes in time order (at most about 130 per storm, well under the 64 KB cap).
    The hourly replay track is not served by the API; it comes from the static stores.
  parameters:
    - $ref: ../components/parameters/Sid.yaml
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: The track.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/geo+json:
          schema:
            $ref: ../components/schemas/StormTrack.yaml
          examples:
            haiyan:
              $ref: ../components/examples/StormTrackHaiyan.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
