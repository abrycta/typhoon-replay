get:
  operationId: getOpenApiDocument
  tags: [meta]
  summary: The contract bundle
  description: 'Serves `contracts/dist/openapi.json` unchanged, byte-identical across backends. `Cache-Control: public, max-age=60`.'
  parameters:
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: OpenAPI 3.1 document.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OpenApiDocument.yaml
          example:
            openapi: 3.1.0
            info:
              title: Typhoon Replay API
              version: 1.0.0
            paths: {}
    '304':
      $ref: ../components/responses/NotModified.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
