post:
  operationId: createTestSession
  tags: [test-hooks]
  x-internal: true
  summary: 'Test hook: sign in without a provider'
  description: Only when `TR_TEST_HOOKS=1`; otherwise 404 `not-found`. Upserts the user and identity for (`provider`, `email`) and sets the session cookie. Not CSRF-checked.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TestSessionCreate.yaml
        example:
          email: ana@example.com
          provider: github
  responses:
    '201':
      description: Session created.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        Set-Cookie:
          $ref: ../components/headers/Set-Cookie-Session.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TestSessionCreated.yaml
          example:
            userId: 0192f5a0-0000-7000-8000-000000000001
            expiresAt: '2026-11-20T00:00:00Z'
    '400':
      $ref: ../components/responses/Problem400.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
