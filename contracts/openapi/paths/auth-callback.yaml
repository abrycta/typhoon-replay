get:
  operationId: completeLogin
  tags: [auth]
  summary: OAuth2 callback
  description: |
    Consumes the `auth.oauth_state` row, exchanges the code (with the PKCE verifier), reads the provider's userinfo,
    upserts the user and identity, creates an `auth.session` row and sets the session cookie, then redirects to `returnTo`.
    On any failure it redirects to `/signin?error={code}` with `code` one of `access-denied` (the user cancelled),
    `invalid-state` (unknown, expired or reused state), `provider-error` (token or userinfo call failed), and sets no cookie.
  parameters:
    - $ref: ../components/parameters/ProviderPath.yaml
    - name: code
      in: query
      schema:
        type: string
        maxLength: 2048
    - name: state
      in: query
      schema:
        type: string
        maxLength: 128
    - name: error
      in: query
      description: Set by the provider when the user denies access.
      schema:
        type: string
        maxLength: 256
  responses:
    '302':
      description: Signed in (`Set-Cookie` + redirect to `returnTo`) or failed (redirect to `/signin?error=...`, no cookie).
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        Location:
          $ref: ../components/headers/Location.yaml
        Set-Cookie:
          description: The session cookie, on success only. See the logout response for the clearing form.
          schema:
            type: string
          example: __Host-tr_session=q2v8l0kXz3n5bJ1Yc7d9fH4tR6wE2aS0uI8oP3mN5gU; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=2592000
    '404':
      $ref: ../components/responses/Problem404.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
