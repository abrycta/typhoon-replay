get:
  operationId: streamLiveEvents
  tags: [live]
  summary: Live event stream (SSE)
  description: |
    Server-Sent Events (CONTRACT-GUIDE §7). Anonymous, never compressed, `Cache-Control: no-cache`.

    - First frame `retry: 10000`, then `event: snapshot` with `id` = `live.revision.seq`.
    - Resume: when `Last-Event-ID` (header, or `?lastEventId=`) is within the retained window (7 days), the missed events
      are sent in `seq` order and no snapshot; otherwise a snapshot.
    - Heartbeat comment `:` at least every 20 s. New events reach clients within 5 s.
    - `data:` is one line of JSON validated against the schema named in `x-sse-events` for its `event:`.
      The `LiveStreamEvent` component models a parsed frame. Clients MUST ignore unknown event names.
  parameters:
    - $ref: ../components/parameters/LastEventIdHeader.yaml
    - $ref: ../components/parameters/LastEventIdQuery.yaml
  x-sse-events:
    snapshot:
      $ref: ../components/schemas/LiveSnapshot.yaml
    storm-upserted:
      $ref: ../components/schemas/ActiveStorm.yaml
    storm-removed:
      $ref: ../components/schemas/StormRemoved.yaml
  responses:
    '200':
      description: An open event stream.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        X-Accel-Buffering:
          $ref: ../components/headers/X-Accel-Buffering.yaml
      content:
        text/event-stream:
          schema:
            type: string
          examples:
            fresh:
              $ref: ../components/examples/LiveStreamFrames.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
    '503':
      $ref: ../components/responses/Problem503.yaml
