parameters:
  - $ref: ../components/parameters/SavedPlaceId.yaml
patch:
  operationId: updateSavedPlace
  tags: [me]
  summary: Rename a saved place
  security:
    - sessionCookie: []
      csrfHeader: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SavedPlaceUpdate.yaml
        example:
          label: Home (Tacloban)
  responses:
    '200':
      description: Updated.
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SavedPlace.yaml
          examples:
            tacloban:
              $ref: ../components/examples/SavedPlaceTacloban.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '401':
      $ref: ../components/responses/Problem401.yaml
    '403':
      $ref: ../components/responses/Problem403.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '413':
      $ref: ../components/responses/Problem413.yaml
    '415':
      $ref: ../components/responses/Problem415.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
delete:
  operationId: deleteSavedPlace
  tags: [me]
  summary: Remove a saved place
  description: Also removes it from the alert subscription.
  security:
    - sessionCookie: []
      csrfHeader: []
  responses:
    '204':
      $ref: ../components/responses/NoContent.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '401':
      $ref: ../components/responses/Problem401.yaml
    '403':
      $ref: ../components/responses/Problem403.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
