get:
  operationId: startLogin
  tags: [auth]
  summary: Start an OAuth2 login
  description: |
    Stores `state`, the PKCE verifier, the provider and `returnTo` in `auth.oauth_state` (10-minute TTL, single use) and
    redirects to the provider with `response_type=code`, `client_id`, `redirect_uri`, `state`, `code_challenge`
    and `code_challenge_method=S256`. `redirect_uri` is `TR_SITE_ORIGIN` + `X-Forwarded-Prefix` + `/v1/auth/{provider}/callback`.
  parameters:
    - $ref: ../components/parameters/ProviderPath.yaml
    - $ref: ../components/parameters/ReturnTo.yaml
  responses:
    '302':
      description: 'Redirect to the provider''s authorization endpoint. `Cache-Control: private, no-store`.'
      headers:
        X-Backend-Impl:
          $ref: ../components/headers/X-Backend-Impl.yaml
        X-Backend-Version:
          $ref: ../components/headers/X-Backend-Version.yaml
        X-Contract-Version:
          $ref: ../components/headers/X-Contract-Version.yaml
        X-Request-Id:
          $ref: ../components/headers/X-Request-Id.yaml
        Cache-Control:
          $ref: ../components/headers/Cache-Control.yaml
        Vary:
          $ref: ../components/headers/Vary.yaml
        Location:
          $ref: ../components/headers/Location.yaml
    '400':
      $ref: ../components/responses/Problem400.yaml
    '404':
      $ref: ../components/responses/Problem404.yaml
    '429':
      $ref: ../components/responses/Problem429.yaml
    '500':
      $ref: ../components/responses/Problem500.yaml
