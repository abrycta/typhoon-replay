openapi: 3.1.0
info:
  title: Typhoon Replay API
  version: 1.0.0
  summary: One contract, four interchangeable backends (Java, Node, Rust, Go).
  description: |
    Public API behind [Typhoon Replay](https://typhoon-replay.pages.dev): "typhoons that hit my town" over PH cities and
    municipalities and JP municipalities, a live tracker of active storms over Server-Sent Events, and accounts with
    saved places and email alerts. The hour-by-hour replay itself is static and is not served by this API.

    Rules this document cannot express are in `contracts/docs/CONTRACT-GUIDE.md`. The essentials:

    - **Portable subset of OpenAPI 3.1.** Optional fields are omitted, never `null`. Clients MUST ignore unknown fields
      and unknown SSE event types; additive changes are minor versions.
    - **Headers on every response:** `X-Backend-Impl`, `X-Backend-Version`, `X-Contract-Version`, `X-Request-Id`,
      `Cache-Control`, `Vary`.
    - **Errors** are RFC 9457 `application/problem+json` with a stable `code` (see `ProblemCode`).
    - **Caching:** catalogue reads are `public, max-age=300, stale-while-revalidate=86400` with weak ETags derived from
      the dataset version, identical across backends; `If-None-Match` returns 304.
    - **Pagination:** `limit` (1–100) and an opaque `cursor`; `nextCursor` plus `Link: rel="next"` until the last page.
      Cursors are interchangeable between backends.
    - **Size cap:** every JSON response stays at or under 64 KB uncompressed at the maximum `limit`; request bodies over
      64 KB return 413. Responses over 1 KB are gzip-compressed when accepted (br optional); the stream never is.
    - **Rate limits:** enforced per IP by the edge proxy; 429 `rate-limited` with `Retry-After`. `RateLimit` and
      `RateLimit-Policy` headers (IETF draft) may accompany any response.
    - **Auth:** cookie session `__Host-tr_session` shared by all four backends. Unsafe methods also need
      `X-Requested-With: typhoon-replay` and an `Origin` equal to the site origin (403 `csrf`).
  contact:
    name: Typhoon Replay
    url: https://github.com/abrycta/typhoon-replay
servers:
  - url: https://typhoon-replay.pages.dev/api/{impl}
    description: Production, through the same-origin edge proxy (which strips `/api/{impl}`).
    variables:
      impl:
        default: java
        enum: [java, node, rust, go]
  - url: http://localhost:8788/api/{impl}
    description: Local edge proxy (wrangler pages dev).
    variables:
      impl:
        default: java
        enum: [java, node, rust, go]
  - url: http://localhost:4010
    description: Prism mock of this document (`just mock`).
tags:
  - name: alerts
    description: Email alert preferences.
  - name: auth
    description: OAuth2 sign-in (Google, GitHub) with PKCE; shared cookie sessions.
  - name: live
    description: Active storms and the live event stream.
  - name: me
    description: The signed-in user and saved places.
  - name: meta
    description: Probes, metadata and this document.
  - name: places
    description: PH ADM3 and JP municipalities; "typhoons that hit my town".
  - name: storms
    description: The historical storm catalogue (IBTrACS best tracks).
  - name: test-hooks
    description: Conformance-only hooks, enabled by TR_TEST_HOOKS=1 and absent (404) otherwise. Removed from the public bundle.
    x-internal: true
security: []
