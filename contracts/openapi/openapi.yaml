components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tr_session
      description: |
        Opaque session token (32 random bytes, base64url) set by the OAuth callback. Stored server-side only as
        SHA-256 in the shared `auth.session` table, so a session minted by one backend works on all four.
        Missing or invalid on a protected operation: 401 `unauthenticated`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: |
        Required on POST, PUT, PATCH and DELETE with the exact value `typhoon-replay`, together with an `Origin` header
        equal to the site origin (`TR_SITE_ORIGIN`). Otherwise 403 `csrf`.
