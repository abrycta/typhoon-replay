      - id: archive
        archive: true
      - id: hdx-cod-ab-phl
        # 1.06 GB zip of all levels with COD-AB property names (adm3 p-codes, not shapeID):
        # the pipeline needs an adapter before it can use it, so it is a manual fallback.
        url: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/0120c30e-ba8b-487d-83f5-a664eddd3a8e/download/phl_admin_boundaries.geojson.zip
        probe_bytes: { min: 500000000, max: 2000000000 }
        automatic: false
    checks:
      sha256: 0a125b1716b584ac6728ca0249beb49f29636966b6ecb8974bc0c36db01d4624
      bytes: { min: 400000000, max: 700000000 }
      rows: { min: 1600, max: 1700 }
      required_properties: [shapeName, shapeID, shapeType]
    archived: { enabled: true, retention: all }

