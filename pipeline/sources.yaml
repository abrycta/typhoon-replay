# yaml-language-server: $schema=../../data-archive-kit/schema/sources.schema.json
# Replay source registry (format: archivekit, abrycta/data-archive-kit).
#
# Every upstream input the pipeline reads is listed here. `typhoon.sources.fetch(<id>)` walks the
# `links` in order (primary first), validates each download against `checks`, and finally falls back
# to the latest validated snapshot in the private archive repo (the `archive` link). See
# docs/architecture/DATA-RESILIENCE.md for the plain-language plan and runbook.
#
# Link fields:
#   id        stable name, recorded in provenance ("which mirror served the data")
#   url       HTTPS URL (s3:// and gs:// only for kind: remote-dataset, which fetch() never downloads)
#   probe     health-check URL when it differs from `url` (e.g. one object inside a bucket)
#   transform post-download step that turns this link's bytes into the canonical file
#   automatic false = listed and health-checked, but fetch() skips it (different format/schema;
#             a human switches to it via the runbook)
#   probe_size false = skip the size bound in the health probe (CDN reports a compressed size)
#   archive   true = the last-resort link: latest release `<id>-<YYYY-MM-DD>` in archive.repo
#
# checks:
#   bytes / rows   inclusive bounds; rows = CSV data rows (header and units rows excluded) or
#                  GeoJSON features or JSON array items
#   required_columns / required_properties   missing => validation failure
#   header_sha256  exact header fingerprint; a mismatch with the required columns still present is
#                  "schema drift" (warning + health issue), not a failure
#   shrink_tolerance  reject a download whose row count is more than this fraction below the local
#                  copy it would replace (catches silent truncation of append-only data)
#   sha256         exact content pin (pinned releases only)
version: 1
project: typhoon-replay

archive:
  repo: abrycta/typhoon-replay-archive
  token_env: ARCHIVE_READ_TOKEN          # fine-grained PAT: Contents read on kit + archive, Issues read/write on archive
  tag_format: "{id}-{date}"              # date = UTC YYYY-MM-DD of the snapshot
  compression: zstd
  compression_level: auto                # 19 below 150 MB raw, 15 above (measured, see DATA-RESILIENCE.md)

health:
  # Issues go to the private archive repo (the default); pipeline runs in the public repo reach it
  # with ARCHIVE_READ_TOKEN, which therefore also carries Issues: read and write on the archive repo.
  issue_label: source-health
  issue_token_env: ARCHIVE_READ_TOKEN
  token_expiry_warn_days: 30
  token_expires: "2027-10-20"            # ARCHIVE_READ_TOKEN expiry (created 2026-10-21, 1 year)
  user_agent: "typhoon-replay-pipeline/0.1 (+https://github.com/abrycta/typhoon-replay)"

sources:
  # ------------------------------------------------------------------ best tracks
  - id: ibtracs-wp
    description: IBTrACS v04r01 best tracks, Western Pacific list (full tracks of every WP storm)
    kind: file
    format: csv
    filename: ibtracs.WP.list.v04r01.csv
    local_path: data/raw/ibtracs/ibtracs.WP.list.v04r01.csv
    licence: >-
      NOAA NCEI, "full and open access" under WMO Resolution 40; no formal licence.
    attribution: >-
      Knapp, K. R., et al. (2010) BAMS 91, 363-376, doi:10.1175/2009BAMS2755.1; and Gahtan, J., et al.
      (2024) IBTrACS Project, Version 4r01, NOAA NCEI, doi:10.25921/82ty-9e16.
    cadence: three times a week (NCEI); provisional tracks for the current season
    pin: { version: v04r01 }
    hooks: ["typhoon.sources:check_ibtracs"]
    links:
      - id: ncei-csv-wp
        url: https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.WP.list.v04r01.csv
      - id: ncei-csv-all-subset
        # Same columns; keep every row of each SID that has at least one BASIN=WP row.
        url: https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.ALL.list.v04r01.csv
        # Verified 2026-10-21: byte-identical to ibtracs.WP.list.v04r01.csv.
        transform: { name: csv-group-filter, key: SID, column: BASIN, value: WP, header_rows: 2 }
      - id: ncei-netcdf-wp
        url: https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/netcdf/IBTrACS.WP.v04r01.nc
        automatic: false   # NetCDF, not CSV: needs a converter before ibtracs.py can read it
      - id: archive
        archive: true
    checks:
      bytes: { min: 90000000, max: 300000000 }
      rows: { min: 240000, max: 400000 }
      profile: { key: SID, group: SEASON, numeric: [LAT, LON, WMO_WIND, WMO_PRES, USA_WIND], unique: [SID, ISO_TIME] }
      header_rows: 2
      header_sha256: 96873ede925e7a2fe34a12b9c331e67385166e1cac671d4247a6adc7f9749e98
      required_columns: &ibtracs_cols [SID, SEASON, NUMBER, BASIN, SUBBASIN, NAME, ISO_TIME, NATURE,
        LAT, LON, WMO_WIND, WMO_PRES, WMO_AGENCY, TRACK_TYPE, DIST2LAND, LANDFALL, IFLAG, USA_ATCF_ID,
        USA_WIND, USA_PRES, USA_SSHS, USA_RMW, USA_ROCI, USA_GUST, USA_R34_NE, USA_R34_SE, USA_R34_SW,
        USA_R34_NW, USA_R64_NE, USA_R64_SE, USA_R64_SW, USA_R64_NW, TOKYO_GRADE, TOKYO_WIND,
        TOKYO_PRES, TOKYO_R50_LONG, TOKYO_R30_LONG, TOKYO_LAND, CMA_WIND, HKO_WIND, KMA_WIND,
        STORM_SPEED, STORM_DIR]
      shrink_tolerance: 0.02
    archived: { enabled: true, retention: all, max_age_days: 21 }

  - id: ibtracs-all
    description: IBTrACS v04r01 best tracks, all basins (cross-basin checks, future basins)
    kind: file
    format: csv
    filename: ibtracs.ALL.list.v04r01.csv
    local_path: data/raw/ibtracs/ibtracs.ALL.list.v04r01.csv
    licence: >-
      NOAA NCEI, "full and open access" under WMO Resolution 40; no formal licence.
    attribution: >-
      Knapp et al. (2010) doi:10.1175/2009BAMS2755.1; Gahtan et al. (2024) doi:10.25921/82ty-9e16.
    cadence: three times a week (NCEI)
    pin: { version: v04r01 }
    hooks: ["typhoon.sources:check_ibtracs"]
    links:
      - id: ncei-csv-all
        url: https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.ALL.list.v04r01.csv
      - id: ncei-netcdf-all
        url: https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/netcdf/IBTrACS.ALL.v04r01.nc
        automatic: false
      - id: archive
        archive: true
    checks:
      bytes: { min: 250000000, max: 700000000 }
      rows: { min: 650000, max: 1200000 }
      profile: { key: SID, group: SEASON, numeric: [LAT, LON, WMO_WIND, WMO_PRES, USA_WIND], unique: [SID, ISO_TIME] }
      header_rows: 2
      header_sha256: 96873ede925e7a2fe34a12b9c331e67385166e1cac671d4247a6adc7f9749e98
      required_columns: *ibtracs_cols
      shrink_tolerance: 0.02
    archived: { enabled: true, retention: all, max_age_days: 21 }

  # ------------------------------------------------------------------ reanalysis (listed, never archived raw)
  # ERA5 is read as storm-following windows straight from public buckets (HTTP range requests of the
  # exact HDF5 / Zarr chunks), never downloaded whole. Three product families, each with two
  # byte-identical NSF NCAR mirrors and ARCO-ERA5 (same ERA5 fields, different container) behind them.
  # typhoon.era5 walks these links in order per file and records which one served (provenance).
  - id: era5-an-sfc
    description: >-
      ERA5 hourly analysis, single levels: 10 m u and v wind (128_165_10u, 128_166_10v) and mean
      sea-level pressure (128_151_msl). NCAR: monthly NetCDF-4 per variable, chunks (27 h, 139, 279),
      shuffle + gzip.
    kind: remote-dataset
    licence: CC BY 4.0 (Copernicus); NSF NCAR copies also under UCAR data terms.
    attribution: &era5_attr >-
      Contains modified Copernicus Climate Change Service information [year]. Hersbach, H., et al.
      (2020) doi:10.1002/qj.3803. NSF NCAR RDA ds633.0 (doi:10.5065/BH6N-5N20) when served by NCAR.
    cadence: NCAR monthly, about 3 months behind; ARCO ERA5T daily, about 5 days behind
    links:
      - id: ncar-aws
        url: https://nsf-ncar-era5.s3.amazonaws.com/e5.oper.an.sfc
        probe: https://nsf-ncar-era5.s3.amazonaws.com/e5.oper.an.sfc/201311/e5.oper.an.sfc.128_165_10u.ll025sc.2013110100_2013113023.nc
        probe_bytes: { min: 1000000000, max: 3000000000 }
      - id: ncar-osdf
        url: https://osdf-director.osg-htc.org/ncar/rda/d633000/e5.oper.an.sfc
        probe: https://osdf-director.osg-htc.org/ncar/rda/d633000/e5.oper.an.sfc/201311/e5.oper.an.sfc.128_165_10u.ll025sc.2013110100_2013113023.nc
        probe_bytes: { min: 1000000000, max: 3000000000 }
      - id: arco-gcs
        url: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
        probe: https://storage.googleapis.com/gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3/.zmetadata
        probe_bytes: { min: 10000, max: 10000000 }
      - id: earth-engine
        url: ee://ECMWF/ERA5/HOURLY
        probe: https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_HOURLY
        probe_html: true
        automatic: false   # needs a registered Earth Engine project
      - id: copernicus-cds
        url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
        probe: https://cds.climate.copernicus.eu/api/catalogue/v1/collections/reanalysis-era5-single-levels
        automatic: false   # needs an ECMWF account and licence acceptance; queues take hours
    archived: { enabled: false }

  - id: era5-fc-gust
    description: >-
      ERA5 10 m wind gust since the previous post-processing (10fg, 128_049; the maximum gust in the
      hour ending at the valid time). NCAR: forecast files twice a month, chunks (1 init, 12 h, 721,
      1440), shuffle + gzip.
    kind: remote-dataset
    licence: CC BY 4.0 (Copernicus); NSF NCAR copies also under UCAR data terms.
    attribution: *era5_attr
    cadence: NCAR monthly, about 3 months behind; ARCO ERA5T daily, about 5 days behind
    links:
      - id: ncar-aws
        url: https://nsf-ncar-era5.s3.amazonaws.com/e5.oper.fc.sfc.minmax
        probe: https://nsf-ncar-era5.s3.amazonaws.com/e5.oper.fc.sfc.minmax/201311/e5.oper.fc.sfc.minmax.128_049_10fg.ll025sc.2013110106_2013111606.nc
        probe_bytes: { min: 300000000, max: 2000000000 }
      - id: ncar-osdf
        url: https://osdf-director.osg-htc.org/ncar/rda/d633000/e5.oper.fc.sfc.minmax
        probe: https://osdf-director.osg-htc.org/ncar/rda/d633000/e5.oper.fc.sfc.minmax/201311/e5.oper.fc.sfc.minmax.128_049_10fg.ll025sc.2013110106_2013111606.nc
        probe_bytes: { min: 300000000, max: 2000000000 }
      - id: arco-gcs
        url: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
        probe: https://storage.googleapis.com/gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3/10m_wind_gust_since_previous_post_processing/.zarray
        probe_bytes: { min: 100, max: 100000 }
    archived: { enabled: false }

  - id: era5-fc-precip-rate
    description: >-
      ERA5 mean total precipitation rate over the hour ending at the valid time (mtpr, 235_055;
      kg m-2 s-1, x3600 = mm/h), which avoids de-accumulating lsp + cp. NCAR: forecast files twice a
      month, chunks (1 init, 12 h, 721, 1440), shuffle + gzip.
    kind: remote-dataset
    licence: CC BY 4.0 (Copernicus); NSF NCAR copies also under UCAR data terms.
    attribution: *era5_attr
    cadence: NCAR monthly, about 3 months behind; ARCO ERA5T daily, about 5 days behind
    links:
      - id: ncar-aws
        url: https://nsf-ncar-era5.s3.amazonaws.com/e5.oper.fc.sfc.meanflux
        probe: https://nsf-ncar-era5.s3.amazonaws.com/e5.oper.fc.sfc.meanflux/201311/e5.oper.fc.sfc.meanflux.235_055_mtpr.ll025sc.2013110106_2013111606.nc
        probe_bytes: { min: 100000000, max: 2000000000 }
      - id: ncar-osdf
        url: https://osdf-director.osg-htc.org/ncar/rda/d633000/e5.oper.fc.sfc.meanflux
        probe: https://osdf-director.osg-htc.org/ncar/rda/d633000/e5.oper.fc.sfc.meanflux/201311/e5.oper.fc.sfc.meanflux.235_055_mtpr.ll025sc.2013110106_2013111606.nc
        probe_bytes: { min: 100000000, max: 2000000000 }
      - id: arco-gcs
        url: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
        probe: https://storage.googleapis.com/gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3/mean_total_precipitation_rate/.zarray
        probe_bytes: { min: 100, max: 100000 }
    archived: { enabled: false }

  # ------------------------------------------------------------------ boundaries
