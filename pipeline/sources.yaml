    kind: file
    format: geojson
    filename: geoBoundaries-PHL-ADM3.geojson
    local_path: data/raw/boundaries/geoBoundaries-PHL-ADM3.geojson
    licence: >-
      CC BY 3.0 IGO (source: NAMRIA, PSA, OCHA Philippines via HDX COD-AB; geoBoundaries
      boundaryID PHL-ADM3-30758251).
    attribution: >-
      Runfola, D. et al. (2020) geoBoundaries, PLoS ONE 15(4): e0231866; boundaries from NAMRIA and
      PSA via OCHA Philippines, CC BY 3.0 IGO.
    cadence: static (pinned commit); geoBoundaries rebuilds irregularly
    pin:
      repo: wmgeolab/geoBoundaries
      commit: 9469f09592ced973a3448cf66b6100b741b64c0d
      boundary_id: PHL-ADM3-30758251
    links:
      - id: geoboundaries-github
        url: https://github.com/wmgeolab/geoBoundaries/raw/9469f09592ced973a3448cf66b6100b741b64c0d/releaseData/gbOpen/PHL/ADM3/geoBoundaries-PHL-ADM3.geojson
