  # ------------------------------------------------------------------ PAGASA local names
  - id: pagasa-crosswalk
    description: >-
      Curated PAGASA <-> international name crosswalk. The CSV in this repo is the source of truth;
      git history is its versioning, so it is neither fetched nor archived.
    kind: repo-file
    format: csv
    local_path: pipeline/crosswalk/pagasa_names_seed.csv
    licence: CC BY-SA 4.0 (facts compiled with Wikipedia as a cited source).
    share_alike: true
    attribution: Per-row source_url column (Wikipedia articles and season pages).
    cadence: manual, after each season
    links: []
    checks:
      header_rows: 1
      rows: { min: 50, max: 5000 }
      required_columns: [pagasa_name, intl_name, season, source_url]
    archived: { enabled: false }

  - id: wikipedia-season-pages
    description: >-
      English Wikipedia "YYYY Pacific typhoon season" wikitext (?action=raw). Update INPUT for the
      crosswalk only; never read at runtime. Throttle below 1 request/s (HTTP 429 seen at 1/s).
    kind: update-input
    format: text
    licence: CC BY-SA 4.0
    share_alike: true
    attribution: Wikipedia contributors, "<year> Pacific typhoon season", English Wikipedia.
    cadence: ad hoc (python -m typhoon.crosswalk scrape)
    # Templated: typhoon.sources.fetch_template("wikipedia-season-pages", year=2013) fills {year} and
    # runs the same archivekit fetch (checks, atomic write, provenance) for that one page.
    filename: "{year}_Pacific_typhoon_season.wiki"
    local_path: "data/raw/wikipedia/{year}_Pacific_typhoon_season.wiki"
    links:
      - id: enwiki-raw
        url: https://en.wikipedia.org/w/index.php?title={year}_Pacific_typhoon_season&action=raw
        probe: https://en.wikipedia.org/w/index.php?title=2013_Pacific_typhoon_season&action=raw
        probe_contains: "Pacific typhoon season"
    checks:
      bytes: { min: 5000, max: 3000000 }
      contains: "typhoon season"
    archived: { enabled: false }

  # ------------------------------------------------------------------ live feeds (samples only)
  # The archive keeps periodic SAMPLES of these for parser tests. It is not a live mirror, so the
  # archive is not a fetch() fallback for live data: a week-old sample presented as "live" would be
  # wrong. A live-feed outage pauses the tracker ("last updated X ago").
  - id: jtwc-rss
    description: JTWC tropical cyclone RSS (warnings and graphics for active storms)
    kind: live-feed
    format: xml
    filename: jtwc.rss
    licence: US Government work (public domain); JTWC products are not for official use outside DoD.
    attribution: Joint Typhoon Warning Center (JTWC), U.S. Navy / U.S. Air Force.
    cadence: every 6 h per active storm
    links:
      - id: metoc
        url: https://www.metoc.navy.mil/jtwc/rss/jtwc.rss
    checks:
      bytes: { min: 200, max: 2000000 }
      xml_root: rss
    anomaly: { max_row_change: 3.0, auto_approve_after: 2 }   # item count swings as storms start and end (+-300%)
    archived: { enabled: true, retention: { keep_last: 26 }, sample_only: true }

  - id: jtwc-abpw
    description: JTWC significant tropical weather advisory, Western Pacific (text)
    kind: live-feed
    format: text
    filename: abpwweb.txt
    licence: US Government work (public domain).
    attribution: Joint Typhoon Warning Center (JTWC).
    cadence: daily, plus updates
    links:
      - id: metoc
        url: https://www.metoc.navy.mil/jtwc/products/abpwweb.txt
    checks:
      bytes: { min: 100, max: 200000 }
      contains: "WESTERN NORTH PACIFIC"
    anomaly: { max_row_change: 3.0, auto_approve_after: 2 }   # one paragraph per storm or disturbance (+-300%)
    archived: { enabled: true, retention: { keep_last: 26 }, sample_only: true }

  - id: jma-bosai-target-tc
    description: JMA bosai list of tracked tropical cyclones (entry point to per-TC JSON)
    kind: live-feed
    format: json
    filename: targetTc.json
    licence: JMA website terms (government standard terms of use, compatible with CC BY 4.0).
    attribution: Source - Japan Meteorological Agency (気象庁) website.
    cadence: every 1-3 h while a TC is active
    links:
      - id: jma-bosai
        url: https://www.jma.go.jp/bosai/typhoon/data/targetTc.json
    checks:
      bytes: { min: 2, max: 100000 }
      json_type: array
    hooks: ["typhoon.sources:check_jma_target_tc"]   # list of {tropicalCyclone: TCnnnn, category, issue}
    anomaly: { max_row_change: 4.0, auto_approve_after: 2 }   # 0-5 tracked TCs at a time (1 -> 5 is +400%)
    archived: { enabled: true, retention: { keep_last: 26 }, sample_only: true }

  - id: jma-xml-extra
    description: JMA disaster-prevention XML feed (extra), incl. typhoon advisories (台風解析・予報情報)
    kind: live-feed
    format: xml
    filename: jma-extra.xml
    licence: JMA website terms (government standard terms of use, compatible with CC BY 4.0).
    attribution: Source - Japan Meteorological Agency (気象庁) XML feed.
    cadence: minutes
    links:
      - id: jma-xml
        url: https://www.data.jma.go.jp/developer/xml/feed/extra.xml
    checks:
      bytes: { min: 500, max: 5000000 }
      xml_root: feed
    anomaly: { max_row_change: 1.0, auto_approve_after: 2 }   # entry count swings as storms start and end (+-100%)
    archived: { enabled: true, retention: { keep_last: 26 }, sample_only: true }

  - id: gdacs-rss-tc
    description: GDACS tropical cyclone RSS, last 7 days
    kind: live-feed
    format: xml
    filename: gdacs_rss_tc_7d.xml
    licence: GDACS terms (free use with attribution; JRC/UN OCHA).
    attribution: Global Disaster Alert and Coordination System (GDACS), European Commission JRC and UN OCHA.
    cadence: event-driven
    links:
      - id: gdacs-rss
        url: https://www.gdacs.org/xml/rss_tc_7d.xml
      - id: gdacs-api   # documented at https://www.gdacs.org/gdacsapi/swagger (Events/geteventlist/search)
        url: https://www.gdacs.org/gdacsapi/api/Events/geteventlist/search?eventlist=TC
        automatic: false   # JSON, not RSS
    checks:
      bytes: { min: 200, max: 5000000 }
      xml_root: rss
    anomaly: { max_row_change: 3.0, auto_approve_after: 2 }   # 7-day TC list swings as storms start and end (+-300%)
    archived: { enabled: true, retention: { keep_last: 26 }, sample_only: true }
