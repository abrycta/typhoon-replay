[project]
name = "typhoon-pipeline"
version = "0.1.0"
description = "Typhoon Replay data pipeline: IBTrACS ingest, ERA5 storm frames, PAGASA name crosswalk"
authors = [{ name = "Kurt" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "archivekit",
    "duckdb>=1.5.6",
    "gcsfs>=2026.10.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "netcdf4>=1.7.5",
    "numcodecs>=0.17.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "s3fs>=2026.9.0",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.1",
]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]

[tool.uv.sources]
archivekit = { git = "https://github.com/abrycta/data-archive-kit", rev = "v1.0.0" }
