[package]
name = "contract"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The contract's schemas as Rust types (typify output, committed): crates/codegen regenerates them.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "alloc"] }
regress = "=0.12.0"
