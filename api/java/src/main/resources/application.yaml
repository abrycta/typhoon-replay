# Configuration comes only from the environment, with the names every backend shares (CONTRACT-GUIDE §11):
# DATABASE_URL (see DatabaseUrlEnvironment), TR_SITE_ORIGIN, TR_TEST_HOOKS, TR_LOG_LEVEL, PORT.
tr:
  impl: java
  # The browser-visible origin: absolute Link headers (with X-Forwarded-Prefix).
  site-origin: ${TR_SITE_ORIGIN:https://replay.krtmtthw.dev}
  test-hooks: ${TR_TEST_HOOKS:0}
  # Contract 2.0.0 reads only catalog/live/ops, which 000500 already has, so this build also runs before or after
  # 20261021000600_drop_accounts is applied (deploy first, then migrate).
  min-schema-version: "20261021000500"
  commit: ${TR_COMMIT:${RENDER_GIT_COMMIT:unknown}}
  rate-limit-per-minute: ${TR_RATE_LIMIT_PER_MINUTE:600}
  max-streams: ${TR_MAX_STREAMS:200}
  # Live streams one client address may hold at once (429 rate-limited above it); 0 disables the cap.
  max-streams-per-client: ${TR_MAX_STREAMS_PER_CLIENT:6}
  # Shared with the edge proxy (Pages secret EDGE_SECRET): proves a request came through it. When set, /v1/* without
  # it gets 403 (EdgeSecretFilter) and X-Forwarded-For is trusted only with it (RateLimitFilter).
  edge-secret: ${TR_EDGE_SECRET:}

server:
  port: ${PORT:8080}
  shutdown: graceful
  # gzip for JSON over 1 KB (CONTRACT-GUIDE §4); text/event-stream is deliberately absent: the stream is never compressed.
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/problem+json,application/geo+json,text/html
  tomcat:
    max-swallow-size: 128KB
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: typhoon-replay-java
  main:
    banner-mode: "off"
  servlet:
    multipart:
      enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # Neon free tier: at most 5 pooled connections per backend, none held while idle (scale to zero).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
      # Retire connections well before Neon suspends an idle compute (5 min) or its pooler recycles them, and ping
      # one that sits idle for a minute so a connection the pooler dropped is replaced before a request gets it.
      # With minimum-idle 0 idle connections close after 30 s anyway, so neither keeps the compute awake.
      max-lifetime: 300000
      keepalive-time: 60000
      # A suspended Neon compute takes a few seconds (occasionally 10-20 s) to resume. Wait for it instead of
      # failing after 5 s, but stay under the edge proxy's 29 s background window (edge/src/proxy.ts), so a
      # request the edge answered with backend-waking still finishes and fills the edge cache.
      connection-timeout: 25000
      # Never fail startup on the database: the app starts and /healthz answers while Neon is still asleep.
      initialization-fail-timeout: -1
      pool-name: tr
  jdbc:
    template:
      query-timeout: 5s
  sql:
    init:
      mode: never
  mvc:
    dispatch-trace-request: true
    async:
      request-timeout: 30m
    problemdetails:
      enabled: false
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,contractSchema
  health:
    db:
      enabled: false

logging:
  structured:
    format:
      console: dev.krtmtthw.typhoon.shared.logging.JsonLineFormatter
  level:
    root: ${TR_LOG_LEVEL:info}
