<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Akari pre-paint theme: the shared krtmtthw.dev cookie (or localStorage) before first paint. External, so CSP-safe. -->
    <script src="/theme-init.js" data-shared-cookie-domain="krtmtthw.dev"></script>
    <!-- Pre-paint language: ?lang= (share links) or the saved choice, before React mounts (public/lang-init.js). -->
    <script src="/lang-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <!-- Runtime config and the dataset host are on the critical path of every replay. -->
    <link rel="preload" href="/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://huggingface.co" crossorigin />
    <meta name="description" content="Replay any typhoon that hit the Philippines or Japan, hour by hour." />
    <!-- Pre-load still: the project's kanji glyph, the same quiet tile as krtmtthw.dev's embed slots (Akari muted tokens),
      until the view is ready. Inside #root, so React's first render replaces it. -->
    <style>
      .glyph-seal {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--muted, #efede7);
        color: var(--muted-foreground, #6b6a66);
        font-family: var(--font-heading, "Hiragino Mincho ProN", "Yu Mincho", serif);
        font-size: clamp(48px, 9vw, 80px);
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
      }
      html[data-embed-ready] .glyph-seal {
        display: none;
      }
    </style>
    <title>Replay</title>
  </head>
  <body>
    <div id="root"><div class="glyph-seal" aria-hidden="true" lang="ja">再</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
