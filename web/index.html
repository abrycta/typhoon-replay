<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Akari pre-paint theme: the shared krtmtthw.dev cookie (or localStorage) before first paint. External, so CSP-safe. -->
    <script src="/theme-init.js" data-shared-cookie-domain="krtmtthw.dev"></script>
    <!-- Pre-paint language: ?lang= (share links) or the saved choice, before React mounts (public/lang-init.js). -->
    <script src="/lang-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <!-- Runtime config and the dataset host are on the critical path of every replay. -->
    <link rel="preload" href="/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://huggingface.co" crossorigin />
    <!-- Frame sheets of storms not bundled with the site redirect to Hugging Face's file CDN. -->
    <link rel="preconnect" href="https://us.aws.cdn.hf.co" crossorigin />
    <meta name="description" content="Replay any typhoon that hit the Philippines or Japan, hour by hour." />
    <title>Replay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
