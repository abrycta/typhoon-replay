# Rust backend (api/rust): workers-rs + Axum 0.8 → WebAssembly on Cloudflare Workers, Neon serverless HTTP
# (docs/architecture/DECISIONS.md, "Update 2026-10-22").
#   build        bundle the contract, generated contract types up to date, fmt, clippy, unit tests, worker-build
#                (wasm, size checked against the free plan), build/ uploaded for the next jobs
#   conformance  the built worker in local workerd (wrangler dev) against PostGIS 18 with the migrations and seed,
#                reached through Neon's open-source SQL-over-HTTP proxy; Vitest scenarios (SSE heartbeat and a
#                no-hooks instance included) and Schemathesis
#   deploy       main only, after conformance: wrangler deploy (free plan), then the deployed-instance scenarios
#                that do not depend on the fixture data
name: Rust

on:
  pull_request:
    paths:
      - api/rust/**
      - contracts/**
      - .github/workflows/rust.yml
  push:
    branches: [main]
    paths:
      - api/rust/**
      - contracts/**
      - .github/workflows/rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKER_BUILD_VERSION: 0.8.7
  CARGO_TERM_COLOR: never
  DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.37
  POSTGIS_IMAGE: postgis/postgis:18-3.6
  SCHEMATHESIS_IMAGE: schemathesis/schemathesis:stable
  # Neon's SQL-over-HTTP proxy for a plain Postgres (github.com/TimoWilhelm/local-neon-http-proxy), pinned by digest.
  NEON_PROXY_IMAGE: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
  DEPLOYED_URL: https://replay-api-rust.krtmtthw.workers.dev

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            api/rust/package-lock.json

      - name: Bundle the contract
        working-directory: contracts
        run: |
          npm ci
          npm run bundle

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
            api/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('api/rust/rust-toolchain.toml', 'api/rust/Cargo.lock') }}-wb${{ env.WORKER_BUILD_VERSION }}

      - name: Toolchain (rust-toolchain.toml) and worker-build (pinned)
        working-directory: api/rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          command -v worker-build >/dev/null && worker-build --version | grep -q "$WORKER_BUILD_VERSION" \
            || cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked --force

      - name: Generated contract types are up to date
        working-directory: api/rust
        run: |
          cargo run --locked -q -p codegen
          cargo fmt --all
          git diff --exit-code -- crates/contract

      - name: Format, clippy and unit tests
        working-directory: api/rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p server --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked -p server --lib

      - name: Build the worker (wasm, size checked)
        working-directory: api/rust
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-worker
          path: api/rust/crates/server/build/
          include-hidden-files: true
          if-no-files-found: error

  conformance:
    name: Conformance (scenarios + Schemathesis)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: tr
          POSTGRES_PASSWORD: tr
          POSTGRES_DB: typhoon
        ports:
          - 5432:5432
        volumes:
          - /tmp/empty-initdb:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd "pg_isready -U tr -d typhoon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://tr:tr@localhost:5432/typhoon?sslmode=disable
      SITE_ORIGIN: http://localhost:8788
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            api/rust/package-lock.json

      - name: Install and bundle the contract
        working-directory: contracts
        run: |
          npm ci
          npm run bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-worker
          path: api/rust/crates/server/build/

      - name: Migrate and seed
        run: |
          docker run --rm --network host -e DATABASE_URL -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true \
            -v "$PWD/contracts/db:/db:ro" "$DBMATE_IMAGE" --wait up
          docker run --rm --network host -v "$PWD/contracts/db:/db:ro" "$POSTGIS_IMAGE" \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f /db/seed/seed.sql

      - name: Start the Neon HTTP proxy (:4444)
        run: |
          docker run -d --name neon-proxy --network host -e PG_CONNECTION_STRING="postgres://tr:tr@localhost:5432/typhoon" "$NEON_PROXY_IMAGE"
          for _ in $(seq 60); do
            curl -fsS -o /dev/null -X POST http://localhost:4444/sql -H 'Neon-Connection-String: postgres://tr:tr@db.localtest.me:5432/typhoon' \
              -d '{"query":"select 1","params":[]}' && break
            sleep 1
          done

      - name: Start two workers (hooks on :8090, hooks off :8092)
        working-directory: api/rust
        run: |
          npm ci
          DATABASE_URL=postgres://tr:tr@db.localtest.me:5432/typhoon nohup scripts/serve-local.sh 8090 1 > /tmp/rust-8090.log 2>&1 &
          DATABASE_URL=postgres://tr:tr@db.localtest.me:5432/typhoon nohup scripts/serve-local.sh 8092 0 > /tmp/rust-8092.log 2>&1 &
          for port in 8090 8092; do
            for _ in $(seq 90); do curl -fsS -o /dev/null "http://localhost:$port/readyz" && break; sleep 1; done
            curl -fsS "http://localhost:$port/readyz"
          done

      - name: Scenario suite (Vitest, IMPL=rust, SSE heartbeat included)
        working-directory: contracts
        env:
          BASE_URL: http://localhost:8090
          IMPL: rust
          SLOW: "1"
          NO_HOOKS_BASE_URL: http://localhost:8092
        run: npm run conformance

      - name: Reload the fixture
        run: |
          docker run --rm --network host -v "$PWD/contracts/db:/db:ro" "$POSTGIS_IMAGE" \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f /db/seed/seed.sql

      - name: Schemathesis (gating)
        run: |
          mkdir -p contracts/conformance/results
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -e BASE_URL=http://localhost:8090 \
            -e TR_SITE_ORIGIN="$SITE_ORIGIN" -v "$PWD/contracts:/c" -w /c/conformance/results "$SCHEMATHESIS_IMAGE" \
            --config-file /c/conformance/schemathesis/backend.toml run /c/dist/openapi.json \
            --exclude-checks positive_data_acceptance --request-retries 3 \
            --report junit --report-junit-path /c/conformance/results/rust-schemathesis.xml

      - name: Compatibility table
        if: always()
        working-directory: contracts
        run: mkdir -p conformance/results && npm run compat-table >> "$GITHUB_STEP_SUMMARY"

      - name: Worker logs
        if: failure()
        run: |
          tail -100 /tmp/rust-8090.log
          tail -50 /tmp/rust-8092.log
          docker logs neon-proxy 2>&1 | tail -50

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-conformance-results
          path: contracts/conformance/results/
          if-no-files-found: ignore

  deploy:
    name: Deploy (Cloudflare Workers) and check the deployed instance
    needs: conformance
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rust-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            api/rust/package-lock.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-worker
          path: api/rust/crates/server/build/

      # DATABASE_URL and TR_EDGE_SECRET are Worker secrets, set once with `wrangler secret put` (api/rust/README.md).
      - name: wrangler deploy
        working-directory: api/rust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy --var "TR_COMMIT:${GITHUB_SHA::7}"

      # The deployed instance serves the production dataset, not the fixture, so only the scenarios that hold for any
      # dataset run here (headers, caching, problems, test hooks absent). Hooks are off in production.
      - name: Deployed-instance scenarios
        working-directory: contracts
        env:
          BASE_URL: ${{ env.DEPLOYED_URL }}
          IMPL: rust
          TEST_HOOKS: "0"
          NO_HOOKS_BASE_URL: ${{ env.DEPLOYED_URL }}
          SITE_ORIGIN: https://replay.krtmtthw.dev
        run: |
          npm ci
          npm run bundle
          npx vitest run --config conformance/vitest.config.ts headers caching problems test-hooks
