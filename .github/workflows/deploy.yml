# Deploy to Cloudflare Pages (direct upload with wrangler, no Pages CI builds).
#   CI passed on a push to main -> production (https://<project>.pages.dev)
#   CI passed on a pull request -> preview at https://pr-<number>.<project>.pages.dev,
#                                  with the URL commented on the PR
#
# Merged means deployed (portfolio rules 17 and 23): this runs whenever CI finishes. Production always deploys
# main's NEWEST commit once that commit's CI is green (.github/scripts/deploy-gate.sh), from that run's `web-dist`
# artifact (never building again): a run triggered by an older commit deploys the newest one, so nothing merged
# is left behind; if the newest commit's CI is still running, its own completion deploys it; if it is red, the
# run fails (red, never grey). Manual runs and live-check.yml dispatches do the same. Each production deploy
# writes /deploy.json with the deployed commit (CI keeps the artifact 3 days).
# Pull requests from forks are never deployed (their artifact is untrusted and they get no secrets).
# Until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets exist, the job skips with a notice.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: # redeploy main's tip (production) from its CI artifact

permissions:
  contents: read

concurrency:
  # One production deploy at a time, never cancelled midway; a newer pending one may replace an older pending
  # one, and both would deploy main's newest green commit. A newer CI pass on a PR cancels its older preview.
  group: >-
    ${{ github.event.workflow_run.event == 'pull_request' &&
    format('deploy-pr-{0}', github.event.workflow_run.head_branch) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  deploy:
    name: ${{ github.event.workflow_run.event == 'pull_request' && 'Preview' || 'Production' }}
    # Production: any CI run on main finishing (the gate picks main's newest green commit), or a manual/dispatched
    # run. Preview: CI succeeded for a PR from this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # download CI's artifact
      pull-requests: write # preview URL comment
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not available. See README, 'Running & deploying'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.enabled == 'true'
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Production gate (main's newest green commit)
        id: gate
        if: steps.secrets.outputs.enabled == 'true' && github.event.workflow_run.event != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/deploy-gate.sh ci.yml

      - name: CI run and commit to deploy
        id: run
        if: steps.secrets.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GATE_DEPLOY: ${{ steps.gate.outputs.deploy }}
          GATE_SHA: ${{ steps.gate.outputs.sha }}
          GATE_RUN: ${{ steps.gate.outputs.run_id }}
        run: |
          if [ "$RUN_EVENT" = pull_request ]; then
            # The PR number for this head branch (workflow_run.pull_requests can be empty).
            pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
            [ -n "$pr" ] || { echo "::error::No open PR for branch $HEAD_BRANCH"; exit 1; }
            { echo "go=true"; echo "pr=$pr"; echo "id=$RUN_ID"; echo "sha=$RUN_SHA"; echo "branch=pr-$pr"; } >> "$GITHUB_OUTPUT"
            echo "Preview of \`${RUN_SHA:0:7}\` as \`pr-$pr\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GATE_DEPLOY" = true ]; then
            { echo "go=true"; echo "id=$GATE_RUN"; echo "sha=$GATE_SHA"; echo "branch=main"; } >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      # Functions (functions/, edge/) and wrangler.jsonc come from the same commit as the build.
      - uses: actions/checkout@v7
        if: steps.run.outputs.go == 'true'
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false

      - name: Download CI's verified build
        if: steps.run.outputs.go == 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v7
        if: steps.run.outputs.go == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Root tooling only (wrangler; public packages): the app's dependencies are not needed to deploy.
      - name: Install wrangler
        if: steps.run.outputs.go == 'true'
        run: npm ci

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.run.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.run.outputs.branch }}
          SHA: ${{ steps.run.outputs.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          source scripts/lib.sh
          load_pages_config
          [[ -f "$DIST_DIR/index.html" ]] || die "CI's artifact has no index.html"
          # Production records the deployed commit for live-check.yml.
          if [ "$BRANCH" = main ]; then
            printf '{"sha":"%s","run":"%s/%s/actions/runs/%s"}\n' "$SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$DIST_DIR/deploy.json"
          fi
          ensure_pages_project
          wrangler pages deploy --branch="$BRANCH" --commit-hash="$SHA" --commit-dirty=true
          jq -r 'select(.type == "pages-deploy-detailed") | "url=\(.url // "")\nalias=\(.alias // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.run.outputs.go == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
          BRANCH: ${{ steps.run.outputs.branch }}
        run: |
          {
            echo "### Deployed \`$BRANCH\` to Cloudflare Pages"
            echo "- Deployment: $URL"
            if [ -n "$ALIAS" ]; then echo "- Branch alias: $ALIAS"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: steps.run.outputs.go == 'true' && steps.run.outputs.pr != ''
        uses: actions/github-script@v9
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias }}
          HEAD_SHA: ${{ steps.run.outputs.sha }}
          PR_NUMBER: ${{ steps.run.outputs.pr }}
        with:
          script: |
            const marker = "<!-- pages-preview -->";
            const { DEPLOY_URL, ALIAS_URL, HEAD_SHA, PR_NUMBER } = process.env;
            const body = [
              marker,
              "**Preview deployed to Cloudflare Pages**",
              "",
              `- This commit (${HEAD_SHA.slice(0, 7)}): ${DEPLOY_URL}`,
              ALIAS_URL ? `- Newest commit on this PR: ${ALIAS_URL}` : "",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = Number(PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
