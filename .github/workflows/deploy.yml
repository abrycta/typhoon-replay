# Deploy to Cloudflare Pages (direct upload with wrangler, no Pages CI builds).
#   push to main  -> production (https://<project>.pages.dev)
#   pull request  -> preview at https://pr-<number>.<project>.pages.dev,
#                    with the URL commented on the PR
# Until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets exist
# (and on PRs from forks, which get no secrets), the job skips with a notice.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-deploy the selected branch (main = production)

permissions:
  contents: read

concurrency:
  # One production deploy at a time, never cancelled midway; a newer push to
  # a PR cancels that PR's older preview deploy.
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write # GitHub Deployments entries via wrangler-action
      packages: read # private @abrycta/* packages on GitHub Packages
      pull-requests: write # preview URL comment
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not available (not configured yet, or a fork PR). See README, 'Running & deploying'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.enabled == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: "**/package-lock.json"
          registry-url: https://npm.pkg.github.com
          scope: "@abrycta"

      - name: Install, check, build, size guard
        if: steps.secrets.outputs.enabled == 'true'
        run: bash scripts/ci.sh --clean
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve target
        id: target
        if: steps.secrets.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          source scripts/lib.sh
          load_pages_config
          ensure_pages_project
          if [ -n "$PR_NUMBER" ]; then branch="pr-$PR_NUMBER"; else branch="${GITHUB_REF_NAME}"; fi
          echo "project=$PAGES_PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uses the wrangler from the root package-lock.json; project name and
          # output directory come from wrangler.jsonc.
          command: >-
            pages deploy
            --branch=${{ steps.target.outputs.branch }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.secrets.outputs.enabled == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          {
            echo "### Deployed \`$BRANCH\` to Cloudflare Pages"
            echo "- Deployment: $URL"
            [ -n "$ALIAS" ] && echo "- Branch alias: $ALIAS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: steps.secrets.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- pages-preview -->";
            const { DEPLOY_URL, ALIAS_URL, HEAD_SHA } = process.env;
            const body = [
              marker,
              "**Preview deployed to Cloudflare Pages**",
              "",
              `- This commit (${HEAD_SHA.slice(0, 7)}): ${DEPLOY_URL}`,
              ALIAS_URL ? `- Newest commit on this PR: ${ALIAS_URL}` : "",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
