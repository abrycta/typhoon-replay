# Install, typecheck, lint, test, build and size guard on every push and PR.
# The steps live in scripts/ci.sh (commands from deploy.config), so this file
# doesn't change when the frontend framework does.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # private @abrycta/* packages on GitHub Packages
  actions: read # the backends' conformance results (web/scripts/conformance-from-ci.mjs)

# Branches and PRs: a newer push cancels the older run. main: never cancelled or replaced (each run has its own
# group), so every merged commit gets a finished CI run and the deploy that follows it ("Merged means deployed").
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: "**/package-lock.json"
          # Writes an .npmrc that reads NODE_AUTH_TOKEN, so adding the private
          # design-system package later needs no workflow change.
          registry-url: https://npm.pkg.github.com
          scope: "@abrycta"

      # `playwright install-deps` runs apt-get update. The runner image's packages.microsoft.com source
      # (not needed here) has been answering 403 or hanging, which failed or timed out CI on main; drop it and
      # bound apt's network waits so a slow mirror fails fast instead of eating the job's 15 minutes.
      - name: Keep apt fast and reliable
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null

      # Playwright: the browser is cached per Playwright version, so a cache hit downloads nothing and only the OS
      # packages come from apt (kept fast by the step above). Each install is bounded (2.5 min per attempt, one retry,
      # step timeout), so a stalled mirror or download fails in minutes with a clear error instead of using up the
      # job. scripts/ci.sh's `npm run e2e:install` then finds the browser in place and downloads nothing.
      - name: Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright OS packages (and the browser on a cache miss)
        timeout-minutes: 6
        env:
          PW_VERSION: ${{ steps.pw.outputs.version }}
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          bounded() { # bounded <what>: <command...> — 150 s per attempt, one retry
            local what=$1; shift
            for i in 1 2; do
              timeout -k 10 150 "$@" && return 0
              echo "::warning::$what failed or stalled (attempt $i of 2)"
            done
            echo "::error title=Playwright install::$what failed twice (2.5 min per attempt); see the log above"
            return 1
          }
          bounded "OS packages (apt)" npx --yes "playwright@$PW_VERSION" install-deps chromium
          if [ "$CACHE_HIT" = true ]; then
            echo "Playwright $PW_VERSION browser restored from cache: no download."
          else
            bounded "Browser download" npx --yes "playwright@$PW_VERSION" install chromium
          fi

      # The Under the hood conformance table shows each backend's latest passing CI run on main: refresh the bundled
      # conformance.json from those runs' artifacts (a backend whose artifact can't be found keeps its committed entry).
      - name: Conformance figures from the backends' CI runs on main
        run: node web/scripts/conformance-from-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install, check, build, size guard
        run: bash scripts/ci.sh --clean
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload the verified build for Deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

# The verified build goes up as the `web-dist` artifact; Deploy (deploy.yml) runs when this workflow
# succeeds and publishes that artifact instead of building again.
# The data pipeline has its own workflows: pipeline.yml, backfill.yml, refresh.yml.
