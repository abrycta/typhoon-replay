# Weekly branch cleanup: deletes remote branches that are done with.
#   deleted  a branch whose PR was merged (and that has had no new commits since), or that is 0 commits ahead of
#            the default branch
#   kept     the default branch, gh-pages, dependabot/*, changeset-release/*, any branch with an open PR, and
#            any branch with commits that are not on the default branch and not part of a merged PR
# Merged PR branches are also deleted on merge (delete_branch_on_merge); this catches the rest.
# workflow_dispatch with dry_run lists what would be deleted without deleting anything.
name: Branch cleanup

on:
  schedule:
    - cron: "29 4 * * 1" # Mondays 04:29 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the branches that would be deleted without deleting them
        type: boolean
        default: true

permissions:
  contents: write # delete branches
  pull-requests: read # find open and merged PRs per branch

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete merged and fully contained branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          deleted=0
          kept=0
          {
            echo "### Branch cleanup"
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: nothing is deleted."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r -u 3 branch sha; do
            case "$branch" in
              "$DEFAULT_BRANCH" | gh-pages | dependabot/* | changeset-release/*) continue ;;
            esac

            open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq 'length')
            if [ "$open" -gt 0 ]; then
              kept=$((kept + 1))
              continue
            fi

            reason=""
            merged=$(gh pr list --repo "$REPO" --head "$branch" --state merged --json number,headRefOid |
              jq -r --arg sha "$sha" '[.[] | select(.headRefOid == $sha)][0].number // empty')
            if [ -n "$merged" ]; then
              reason="PR #$merged merged"
            else
              ahead=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$sha" --jq '.ahead_by')
              if [ "$ahead" -eq 0 ]; then
                reason="0 commits ahead of $DEFAULT_BRANCH"
              fi
            fi

            if [ -z "$reason" ]; then
              kept=$((kept + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "- would delete \`$branch\` ($reason)" >> "$GITHUB_STEP_SUMMARY"
            else
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" --silent
              echo "- deleted \`$branch\` ($reason)" >> "$GITHUB_STEP_SUMMARY"
            fi
            deleted=$((deleted + 1))
          done 3< <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv')

          {
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "$deleted to delete, $kept kept."
            else
              echo "$deleted deleted, $kept kept."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
