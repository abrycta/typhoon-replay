# Backfill ERA5 replay frames for the storm catalogue on GitHub-hosted runners, then publish a new data
# version to Hugging Face. latest.json flips only if every batch and every gate succeeded.
#
#   prepare   IBTrACS refresh + places + JMA + crosswalk + catalogue + exposure, data-quality gates,
#             the next data version number, and a storm-hour-balanced batch plan
#   canary    about 5 % of the planned storm-hours (a stratified sample, split over 4 parallel batches c0..c3)
#             with exactly the frames job's build, validation and upload; the full run starts only if every
#             canary batch passes, so a broken input or check shows up in ~30 min, not after hours
#             (portfolio rule 18). The canary storms are taken out of the full batches, never built twice.
#   frames    matrix over batches: ERA5 windows -> lossy WebP fields + lossless 3-hourly exact grids per storm,
#             validated, uploaded content-addressed to frames/<sid>/ (unreferenced until a version is
#             published); only frames.json goes back to the publish job
#   publish   assemble v<N>/ (index, summaries, tracks, OG images, place shards, stats, tables, manifest),
#             gates, upload (commits of <= 99 files), verify sizes + HTTP Range + CORS, then README.md +
#             latest.json in one commit
#
# Default scope: the ~1,000 storms chosen by typhoon.selection (score + decade floor; 242,409 storm-hours as
# of IBTrACS 2026-10-20). Measured locally: ~0.6 s and ~3.5 MB of NCAR reads per storm-hour. Estimates:
# ~0.85 TB anonymous egress from NCAR's AWS bucket, ~40 runner-hours, so ~2.5 h wall with 20 batches
# (each ~12,000 storm-hours, ~2 h; job cap 6 h); published frames ~0.65 GB (2.6 kB per storm-hour: lossy
# fields ~1.3 kB + exact grids ~1.2 kB). Disk per batch stays under 1 GB. The whole catalogue (2,058
# storms, 424,872 storm-hours) would be ~1.5 TB egress, ~70 runner-hours, ~1.1 GB of frames.
#
# Fail fast: the first failed batch cancels the others (strategy.fail-fast), each batch has a timeout sized
# from its own storm-hours, and the run summary names the batch that failed. Watch for the first failed job
# (gh run view <id> --json jobs), not for the end of the run.
#
# Secrets: ARCHIVE_READ_TOKEN (installs the private archivekit; archive fallback) and HF_TOKEN (write
# access to permission-alluring/typhoon-replay). Without them the jobs skip with a notice.
name: Backfill

on:
  workflow_dispatch:
    inputs:
      batches:
        description: Parallel batches (GitHub Free runs up to 20 jobs at once)
        default: "20"
        required: true
      scope:
        description: "selected = the ~1,000 storms chosen by typhoon.selection; all = the whole catalogue (~2,058)"
        type: choice
        options: [selected, all]
        default: selected
      storms:
        description: "Optional storm list file under pipeline/ (e.g. curated/replay-v1.txt)"
        default: ""
        required: false
      mode:
        description: "missing = only storms whose published frames are absent or stale; all = rebuild"
        type: choice
        options: [missing, all]
        default: missing
      publish:
        description: Publish (flip latest.json) when everything passes
        type: boolean
        default: true
      canary:
        description: "first = canary batches (~5 %) then the full run; only = canary batches, then stop (nothing published); skip = no canary"
        type: choice
        options: [first, only, skip]
        default: first
      reuse_run:
        description: >-
          Optional run ID of an earlier backfill whose frames job succeeded (artifacts kept 7 days): reuse its
          prepared catalogue and frames.json files instead of preparing and building again; the data gates,
          dataset check and upload verification still run
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: data-publish   # shared with refresh.yml: one data version at a time
  cancel-in-progress: false

env:
  HF_ROOT: https://huggingface.co/datasets/permission-alluring/typhoon-replay/resolve/main
  OMP_NUM_THREADS: "2"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read     # reuse_run: download another run's artifacts
    outputs:
      ok: ${{ steps.setup.outputs.ok }}
      version: ${{ steps.plan.outputs.version }}
      batches: ${{ steps.plan.outputs.batches }}
      canary: ${{ steps.plan.outputs.canary }}
      batch_timeout: ${{ steps.plan.outputs.batch_timeout }}
      canary_timeout: ${{ steps.plan.outputs.canary_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-pipeline
        with:
          archive-read-token: ${{ secrets.ARCHIVE_READ_TOKEN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          require-hf: "true"
      - if: steps.setup.outputs.ok == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw/boundaries
            data/raw/naturalearth
            data/processed/places
          key: pinned-sources-${{ hashFiles('pipeline/sources.yaml', 'pipeline/typhoon/places.py') }}
      - name: Reuse the prepared catalogue of run ${{ inputs.reuse_run }}
        if: steps.setup.outputs.ok == 'true' && inputs.reuse_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: data
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Prepare the catalogue
        if: steps.setup.outputs.ok == 'true' && inputs.reuse_run == ''
        working-directory: pipeline
        env:
          ARCHIVE_READ_TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
        run: uv run python -m typhoon prepare --refresh
      - name: Data-quality gates
        if: steps.setup.outputs.ok == 'true'
        working-directory: pipeline
        run: uv run pytest -q -m data
      - id: plan
        name: Version number and batch plan
        if: steps.setup.outputs.ok == 'true'
        working-directory: pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BATCHES: ${{ inputs.batches }}
          STORMS: ${{ inputs.storms }}
          MODE: ${{ inputs.mode }}
          SCOPE: ${{ inputs.scope }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          CANARY: ${{ inputs.canary }}
        run: |
          version=$(uv run python -m typhoon publish next-version)
          if [ -n "$REUSE_RUN" ]; then
            echo '{}' > ../data/plan.json   # nothing to build: the frames come from run $REUSE_RUN
          else
            args=(--batches "$BATCHES" --mode "$MODE" --previous "$HF_ROOT" --out ../data/plan.json)
            if [ "$SCOPE" = "selected" ]; then args+=(--selected); fi
            if [ -n "$STORMS" ]; then args+=(--list "$STORMS"); fi
            if [ "$CANARY" != "skip" ]; then args+=(--canary 0.05 --canary-jobs 4); fi
            uv run python -m typhoon plan "${args[@]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Data version $version" >> "$GITHUB_STEP_SUMMARY"
          # Canary and full batch lists, per-batch timeouts (~0.6 s per storm-hour measured, x1.75 + 20 min,
          # capped below GitHub's 6 h job limit) and the plan line of the run summary.
          PYTHONPATH=. uv run python tools/backfill_plan.py ../data/plan.json "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      - if: steps.setup.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared
          retention-days: 7
          path: |
            data/plan.json
            data/run-manifest.json
            data/processed/catalog
            data/processed/places
            data/processed/exposure
            data/processed/ibtracs
            data/processed/jma
            data/raw/**/*.provenance.json
            data/raw/naturalearth

  canary:
    needs: prepare
    if: needs.prepare.outputs.ok == 'true' && needs.prepare.outputs.canary != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.canary_timeout) }}
    strategy:
      fail-fast: true         # the first failed canary batch stops the canary, and so the run
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.canary) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-pipeline
        with:
          archive-read-token: ${{ secrets.ARCHIVE_READ_TOKEN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          require-hf: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: data
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache/ncar-index
          key: ncar-index-${{ github.run_id }}-${{ matrix.batch }}
          restore-keys: ncar-index-
      - name: Build, validate and upload frames for batch ${{ matrix.batch }}
        working-directory: pipeline
        env:
          ARCHIVE_READ_TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BATCH: ${{ matrix.batch }}
        run: |
          set -o pipefail
          uv run python -m typhoon frames --plan ../data/plan.json --batch "$BATCH" --upload 2>&1 | tee ../data/batch.log
          df -h . | tail -1
      - name: Report the failed batch
        if: failure()
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          {
            echo "### :x: Batch $BATCH failed"
            # Storms log "[n/N] <sid>" when done, so the failing one is the next in the plan.
            done_n=$(grep -oE '\[[0-9]+/[0-9]+\]' data/batch.log 2>/dev/null | tail -1 | tr -dc '0-9/' | cut -d/ -f1 || true)
            python3 -c 'import json,sys; b=json.load(open("data/plan.json"))[sys.argv[1]]; n=int(sys.argv[2] or 0); x=b[n] if n < len(b) else "none (the final upload)"; print(f"Storms done: {n} of {len(b)}; failing storm: {x}")' "$BATCH" "$done_n" || true
            echo '```'
            tail -n 20 data/batch.log 2>/dev/null || echo "(no log: the batch failed before building frames)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frames-meta-${{ matrix.batch }}
          retention-days: 7
          path: |
            data/processed/frames/*/frames.json
            data/processed/frames/*/provenance.json

  frames:
    needs: [prepare, canary]
    # Only after every canary batch passed (or when there is no canary); never in canary-only runs.
    if: >-
      !cancelled() && needs.prepare.outputs.ok == 'true' && needs.prepare.outputs.batches != '[]' &&
      inputs.canary != 'only' && (needs.canary.result == 'success' || needs.canary.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.batch_timeout) }}
    strategy:
      fail-fast: true         # the first failed batch cancels the rest; publish needs all of them anyway
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-pipeline
        with:
          archive-read-token: ${{ secrets.ARCHIVE_READ_TOKEN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          require-hf: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: data
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache/ncar-index
          key: ncar-index-${{ github.run_id }}-${{ matrix.batch }}
          restore-keys: ncar-index-
      - name: Build, validate and upload frames for batch ${{ matrix.batch }}
        working-directory: pipeline
        env:
          ARCHIVE_READ_TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BATCH: ${{ matrix.batch }}
        run: |
          set -o pipefail
          uv run python -m typhoon frames --plan ../data/plan.json --batch "$BATCH" --upload 2>&1 | tee ../data/batch.log
          df -h . | tail -1
      - name: Report the failed batch
        if: failure()
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          {
            echo "### :x: Batch $BATCH failed"
            # Storms log "[n/N] <sid>" when done, so the failing one is the next in the plan.
            done_n=$(grep -oE '\[[0-9]+/[0-9]+\]' data/batch.log 2>/dev/null | tail -1 | tr -dc '0-9/' | cut -d/ -f1 || true)
            python3 -c 'import json,sys; b=json.load(open("data/plan.json"))[sys.argv[1]]; n=int(sys.argv[2] or 0); x=b[n] if n < len(b) else "none (the final upload)"; print(f"Storms done: {n} of {len(b)}; failing storm: {x}")' "$BATCH" "$done_n" || true
            echo '```'
            tail -n 20 data/batch.log 2>/dev/null || echo "(no log: the batch failed before building frames)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frames-meta-${{ matrix.batch }}
          retention-days: 7
          path: |
            data/processed/frames/*/frames.json
            data/processed/frames/*/provenance.json

  publish:
    needs: [prepare, canary, frames]
    # canary and frames succeed only if every batch succeeded; also publish when the plan had nothing to
    # build. Never in canary-only runs.
    if: >-
      always() && inputs.publish && inputs.canary != 'only' && needs.prepare.outputs.ok == 'true' &&
      (needs.canary.result == 'success' || (needs.canary.result == 'skipped' && needs.prepare.outputs.canary == '[]')) &&
      (needs.frames.result == 'success' || (needs.frames.result == 'skipped' && needs.prepare.outputs.batches == '[]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read     # reuse_run: download another run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-pipeline
        with:
          archive-read-token: ${{ secrets.ARCHIVE_READ_TOKEN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          require-hf: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: data
      - if: inputs.reuse_run == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frames-meta-*
          merge-multiple: true
          path: data/processed/frames
      - name: Frames of run ${{ inputs.reuse_run }} (already validated and uploaded there)
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frames-meta-*
          merge-multiple: true
          path: data/processed/frames
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Assemble and check v${{ needs.prepare.outputs.version }}
        working-directory: pipeline
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run python -m typhoon dataset build --version "$VERSION" --previous "$HF_ROOT" --frames-uploaded
      - name: Upload, verify (sizes, Range, CORS), flip latest.json
        working-directory: pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv run python -m typhoon publish upload --version "$VERSION"
          uv run python -m typhoon publish flip --version "$VERSION" | tee ../data/published.json
          echo "Published data version $VERSION: $HF_ROOT/latest.json" >> "$GITHUB_STEP_SUMMARY"

  # The run summary says which batch failed, so nobody has to open every job.
  report:
    needs: [prepare, canary, frames, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Which batch failed
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ needs.prepare.result }}
          CANARY: ${{ needs.canary.result }}
          FRAMES: ${{ needs.frames.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url)) (\(.conclusion))"')
          {
            echo "### Backfill: prepare $PREPARE, canary $CANARY, frames $FRAMES, publish $PUBLISH"
            if [ -n "$failed" ]; then
              echo "**Failed:**"
              echo "$failed"
              if [ "$CANARY" = failure ]; then echo "The canary failed, so the full run did not start."; fi
            else
              echo "No job failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
