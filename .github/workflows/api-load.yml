name: API load
# Load the published data version into the API database (Neon) after every successful Refresh or Backfill run, and
# by hand. typhoon.apiload is idempotent (a version that is already loaded is skipped) and typhoon.dbload stages,
# validates and swaps in ONE transaction, so the four backends serve the old version or the new one, never a mix.
# Failures surface only internally: an ::error annotation and a GitHub issue (one open issue, commented on repeats).
on:
  workflow_run:
    workflows: [Refresh, Backfill]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Data version to load (empty = latest.json)
        type: string
        default: ""
      force:
        description: Load even if this version is already loaded
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-load
  cancel-in-progress: false

env:
  HF_ROOT: https://huggingface.co/datasets/permission-alluring/typhoon-replay/resolve/main/
  API: https://replay.krtmtthw.dev/api

jobs:
  load:
    # Only on this repository's main branch: workflow_run always runs the default-branch workflow file, and a
    # dispatch from another ref is refused, so the database secret never reaches a job that runs PR code.
    if: >-
      github.repository == 'abrycta/typhoon-replay' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - id: secrets
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error title=API load failed::NEON_DATABASE_URL is not set"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-pipeline
        with:
          archive-read-token: ${{ secrets.ARCHIVE_READ_TOKEN }}
      - name: Setup gate
        if: steps.setup.outputs.ok != 'true'
        run: |
          echo "::error title=API load failed::ARCHIVE_READ_TOKEN is not set, so the pipeline environment can't be installed"
          exit 1
      - name: Load the published version (one transaction)
        id: load
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--root "$HF_ROOT")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          uv run python -m typhoon.apiload "${args[@]}" > ../apiload.json
          cat ../apiload.json
          {
            echo "data=$(jq -r .dataVersion ../apiload.json)"
            echo "dataset=$(jq -r .datasetVersion ../apiload.json)"
            echo "loaded=$(jq -r .loaded ../apiload.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Every backend serves the loaded version
        # Render free instances may need a minute to wake; the edge revalidates /v1/meta on every request.
        env:
          WANT: ${{ steps.load.outputs.dataset }}
          DATA: ${{ steps.load.outputs.data }}
          LOADED: ${{ steps.load.outputs.loaded }}
        run: |
          bad=0
          for impl in go java node rust; do
            got=""
            for _ in $(seq 1 30); do
              got=$(curl -s -m 60 "$API/$impl/v1/meta" | jq -r '.datasetVersion // empty' 2>/dev/null || true)
              if [ "$got" = "$WANT" ]; then break; fi
              sleep 20
            done
            if [ "$got" = "$WANT" ]; then echo "$impl: datasetVersion $got"
            else echo "::error title=API load::$impl /v1/meta reports datasetVersion ${got:-nothing}, not $WANT"; bad=1; fi
          done
          verb=$([ "$LOADED" = "true" ] && echo "loaded" || echo "already loaded")
          echo "Data v$DATA $verb as datasetVersion $WANT; backends checked: go, java, node, rust" >> "$GITHUB_STEP_SUMMARY"
          exit "$bad"

  report:
    needs: load
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="API load failed"
          body="The API database load failed: $RUN. The API keeps serving the previous version (the load is one transaction)."
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          echo "::error title=API load failed::$RUN"
