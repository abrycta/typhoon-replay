# Java backend (api/java): build and tests, then the contract conformance suite against the built image.
#   build        bundle the contract, Gradle test (Testcontainers PostGIS 18 + contract migrations/seed), bootJar
#   conformance  Docker image (AOT cache) against a PostGIS 18 service with the migrations and seed,
#                the Vitest scenarios (incl. SSE heartbeat and a no-hooks instance) and Schemathesis
#   deploy       main only, after build and conformance: scripts/render-deploy.mjs (Render's auto-deploy is off)
#   live         the live checks against the deployed service (live.yml)
# PostGIS 18-3.6 matches production (Neon: PostgreSQL 18.6, PostGIS 3.6.4).
name: Java

on:
  pull_request:
    paths:
      - api/java/**
      - contracts/**
      - .github/workflows/java.yml
  push:
    branches: [main]
    paths:
      - api/java/**
      - contracts/**
      - .github/workflows/java.yml
  workflow_dispatch:

permissions:
  contents: read

# main runs are never cancelled or replaced (own group per run); branches and PRs cancel superseded runs.
concurrency:
  group: java-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.37
  POSTGIS_IMAGE: postgis/postgis:18-3.6
  SCHEMATHESIS_IMAGE: schemathesis/schemathesis:stable

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Bundle the contract
        working-directory: contracts
        run: |
          npm ci
          npm run bundle

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test (unit, Modulith verification, Testcontainers PostGIS 18)
        working-directory: api/java
        run: ./gradlew --no-daemon test bootJar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-test-reports
          path: |
            api/java/build/reports/tests/
            api/java/build/test-results/
            api/java/build/spring-modulith-docs/
          if-no-files-found: ignore

  conformance:
    name: Conformance (scenarios + Schemathesis)
    # Builds its own image (or Worker) from the checkout, so it runs alongside build; deploy waits for both.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: tr
          POSTGRES_PASSWORD: tr
          POSTGRES_DB: typhoon
        ports:
          - 5432:5432
        # Like Neon, the database starts without extensions; migration 1 creates them.
        volumes:
          - /tmp/empty-initdb:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd "pg_isready -U tr -d typhoon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://tr:tr@localhost:5432/typhoon?sslmode=disable
      SITE_ORIGIN: http://localhost:8788
      # Checks the gating Schemathesis run leaves out (listed on the Under the hood page with the full run's failures).
      EXCLUDED_CHECKS: positive_data_acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install and bundle the contract
        working-directory: contracts
        run: |
          npm ci
          npm run bundle

      - name: Build the image (with AOT cache)
        run: docker build -f api/java/Dockerfile --build-arg COMMIT_SHA="${GITHUB_SHA::7}" -t typhoon-replay-java:ci .

      - name: Migrate and seed
        run: |
          docker run --rm --network host -e DATABASE_URL -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true \
            -v "$PWD/contracts/db:/db:ro" "$DBMATE_IMAGE" --wait up
          docker run --rm --network host -v "$PWD/contracts/db:/db:ro" "$POSTGIS_IMAGE" \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f /db/seed/seed.sql

      - name: Start two backends (hooks on :8081, hooks off :8085)
        run: |
          common=(--network host -e DATABASE_URL -e TR_SITE_ORIGIN="$SITE_ORIGIN" -e TR_RATE_LIMIT_PER_MINUTE=100000)
          docker run -d --name java "${common[@]}" -e TR_TEST_HOOKS=1 -e PORT=8081 typhoon-replay-java:ci
          docker run -d --name java-nohooks "${common[@]}" -e TR_TEST_HOOKS=0 -e PORT=8085 typhoon-replay-java:ci
          for port in 8081 8085; do
            for _ in $(seq 90); do curl -fsS -o /dev/null "http://localhost:$port/readyz" && break; sleep 1; done
            curl -fsS "http://localhost:$port/readyz"
          done

      - name: Scenario suite (Vitest, IMPL=java, SSE heartbeat included)
        working-directory: contracts
        env:
          BASE_URL: http://localhost:8081
          IMPL: java
          SLOW: "1"
          NO_HOOKS_BASE_URL: http://localhost:8085
        run: npm run conformance

      - name: Reload the fixture
        run: |
          docker run --rm --network host -v "$PWD/contracts/db:/db:ro" "$POSTGIS_IMAGE" \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f /db/seed/seed.sql

      # The full contract config. Known contract-side gap (api/java/README.md "Conformance"): generated data the
      # schema can't rule out (a random cursor, season combined with from/to) trips positive_data_acceptance.
      # The examples themselves are valid requests since contract 2.0.1.
      - name: Schemathesis (every check, informational)
        continue-on-error: true
        run: |
          mkdir -p contracts/conformance/results
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -e BASE_URL=http://localhost:8081 \
            -e TR_SITE_ORIGIN="$SITE_ORIGIN" -v "$PWD/contracts:/c" -w /c/conformance/results "$SCHEMATHESIS_IMAGE" \
            --config-file /c/conformance/schemathesis/backend.toml run /c/dist/openapi.json \
            --report junit --report-junit-path /c/conformance/results/java-schemathesis-full.xml \
            | tee contracts/conformance/results/java-schemathesis-full.log

      - name: Reload the fixture
        run: |
          docker run --rm --network host -v "$PWD/contracts/db:/db:ro" "$POSTGIS_IMAGE" \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f /db/seed/seed.sql

      - name: Schemathesis (gating, known contract gaps excluded)
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -e BASE_URL=http://localhost:8081 \
            -e TR_SITE_ORIGIN="$SITE_ORIGIN" -v "$PWD/contracts:/c" -w /c/conformance/results "$SCHEMATHESIS_IMAGE" \
            --config-file /c/conformance/schemathesis/backend.toml run /c/dist/openapi.json \
            --exclude-checks "$EXCLUDED_CHECKS" --request-retries 3 \
            --report junit --report-junit-path /c/conformance/results/java-schemathesis.xml \
            | tee contracts/conformance/results/java-schemathesis.log

      # <impl>-conformance.json for the Under the hood table (web/scripts/conformance-from-ci.mjs reads it from main).
      - name: Conformance summary (for the web page)
        working-directory: contracts
        run: node conformance/scripts/summarize.mjs java

      - name: Compatibility table
        if: always()
        working-directory: contracts
        run: npm run compat-table >> "$GITHUB_STEP_SUMMARY"

      - name: Backend logs
        if: failure()
        run: |
          docker logs java | tail -200

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-conformance-results
          path: contracts/conformance/results/
          if-no-files-found: ignore

  # Render auto-deploy is off: main deploys here, only after the tests and conformance above passed.
  deploy:
    name: Deploy to Render
    needs: [build, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: java-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Deploy this commit and wait until it is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/render-deploy.mjs typhoon-replay-java "$GITHUB_SHA"

  live:
    name: Live check
    needs: deploy
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/live.yml
    with:
      impl: java
    secrets:
      TR_EDGE_SECRET: ${{ secrets.TR_EDGE_SECRET }}
