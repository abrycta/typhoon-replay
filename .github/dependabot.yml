# Dependency updates (Dependabot). Version updates: weekly, one grouped PR per ecosystem, at most 2 open.
# Security updates are separate and immediate (repo setting: Dependabot security updates).
# Majors of react, react-dom, astro, vite and maplibre-gl, and @abrycta/* (Akari, portfolio rule 23),
# are upgraded by hand. TypeScript majors too: TypeScript 7 (the native compiler) is outside the peer range of
# typescript-eslint (<6.1) and openapi-typescript (^5), so npm ci fails until those support it.
version: 2
registries:
  # @abrycta/akari comes from GitHub Packages. Dependabot secret DEPENDABOT_PACKAGES_TOKEN (set 2026-10-22): a
  # classic personal access token with read:packages only. Without it every npm update job fails with
  # "Secret Not Found"; a change to this file re-runs the update jobs.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    # Dependabot needs the scope (or a committed .npmrc); without it every npm job fails with private_registry_config_not_found.
    scope: "@abrycta"
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directories: ["/", "/web", "/api/node", "/api/rust"]
    registries: [github-packages]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "@abrycta/*"
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and the deploys run Node 24: keep @types/node on 24.x so the types match the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # /contracts has its own entry (same settings) only so the ignores below apply there and nowhere else.
  - package-ecosystem: npm
    directories: ["/contracts"]
    registries: [github-packages]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      npm-contracts:
        patterns: ["*"]
    ignore:
      - dependency-name: "@abrycta/*"
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and the deploys run Node 24: keep @types/node on 24.x so the types match the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Dev-only (the Prism mock server): @stoplight/prism-cli 5.16.0, the latest, pulls postman-collection 4.5.0,
      # which pins @faker-js/faker 5.5.3, uuid 8.3.2 and lodash 4.17.21. No safe upgrade exists (faker 5 -> 10 and
      # uuid 8 -> 14 are breaking), so every security update job for them failed with security_update_not_possible.
      # Remove these when prism-cli ships with a newer postman-collection.
      - dependency-name: "@faker-js/faker"
      - dependency-name: uuid
      - dependency-name: lodash
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
